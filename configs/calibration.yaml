regime: calibration
trials_per_optimizer: 16
sampler: log_uniform
freeze_after_selection: true
primary_weight_decay: 0.0
schedule: constant
precision: fp32
mlp:
  depths: [4, 8]
  steps: 5000
  batch_size: 128
  success_loss: 0.20
  success_accuracy: 0.95
  learning_rate_ranges:
    sgd: [1.0e-5, 1.0]
    adam: [1.0e-5, 1.0e-2]
    muon: [1.0e-4, 1.0e-1]
    rsgd: [1.0e-5, 1.0e-1]
    mm: [1.0e-5, 1.0e-1]
rnn:
  max_lengths: [50, 100]
  steps: 10000
  batch_size: 128
  success_loss: 0.10
  success_accuracy: 0.95
  learning_rate_ranges:
    sgd: [1.0e-5, 1.0e-1]
    adam: [1.0e-5, 1.0e-2]
    muon: [1.0e-5, 1.0e-1]
    rsgd: [1.0e-5, 1.0e-1]
    mm: [1.0e-5, 1.0e-1]
