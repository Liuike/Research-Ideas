# Frozen paper-reconstruction recipe for PURe ResNet-18 on CIFAR-10.
protocol: pure-cifar10-resnet18-v1
seeds: [0, 1, 2, 3, 4]
data_seed_offset: 100000
epochs: 160
batch_size: 128
learning_rate: 0.01
momentum: 0.9
weight_decay: 0.001
milestones: [80, 120]
gamma: 0.1
device: cuda
num_workers: 4
data_dir: data/cifar10
download: false
train_examples: 50000
test_examples: 10000
secondary: true
stage: reproduction
run_group: pure-cifar10-resnet18-v1
