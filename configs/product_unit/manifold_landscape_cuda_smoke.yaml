# Disposable validation of all 16 task/architecture cells and both landscape views.
protocol: punn-manifold-recorded-v1
conditions:
- task: f1
  architecture: small
- task: f1
  architecture: oversized
- task: f4
  architecture: small
- task: f4
  architecture: oversized
- task: xor
  architecture: small
- task: xor
  architecture: oversized
- task: xor
  architecture: regularized
- task: iris
  architecture: small
- task: iris
  architecture: oversized
- task: iris
  architecture: regularized
- task: wine
  architecture: small
- task: wine
  architecture: oversized
- task: wine
  architecture: regularized
- task: diabetes
  architecture: small
- task: diabetes
  architecture: oversized
- task: diabetes
  architecture: regularized
seeds:
- 999
data_seed_offset: 100000
epochs: 2
regularization_lambda: 0.0001
log_every: 50
device: cuda
stage: engineering-smoke
run_group: punn-manifold-landscape-cuda-smoke-v1
methods:
- manifold_muon_da10
optimizer_settings:
  manifold_muon_da10:
    learning_rate: 0.01
    momentum: 0.95
    weight_decay: 0.0
    aux_learning_rate: 0.001
    secondary: false
    manifold_scale: 1.0
    dual_learning_rate: 0.01
    dual_iterations: 10
landscape_device: cuda
landscape_seed_offset: 2000000
slice_points: 5
slice_radius: 1.0
landscape_batch_size: 16
slice_every: 1
landscape_views:
- ambient
- manifold
