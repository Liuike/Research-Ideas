[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimizer-resurrection"
version = "0.1.0"
description = "Trainability-boundary experiments for Muon and Stiefel Manifold Muon"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.4.6",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "PyYAML==6.0.3",
  "wandb==0.29.0",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "pandas>=2.2", "scipy>=1.13"]
test = ["pytest>=8.2"]

[project.scripts]
resurrection-train = "optimizer_resurrection.train:main"
resurrection-experiment = "optimizer_resurrection.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = "==0.12.11"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
  "integration: runs complete model training with a mocked online W&B run",
]
