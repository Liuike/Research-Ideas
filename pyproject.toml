[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optimizer-resurrection"
version = "0.1.0"
description = "Trainability-boundary experiments for Muon and Stiefel Manifold Muon"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "torch>=2.4",
  "torchvision>=0.19",
  "PyYAML>=6.0",
  "wandb>=0.17",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8", "pandas>=2.2", "scipy>=1.13"]
test = ["pytest>=8.2"]

[project.scripts]
resurrection-train = "optimizer_resurrection.train:main"
resurrection-experiment = "optimizer_resurrection.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
markers = [
  "integration: runs complete model training with a mocked online W&B run",
]
